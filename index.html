<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roblox Verification</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .box {
            background: #222;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 350px;
        }

        h1 {
            margin-top: 0;
        }

        .roblox-button {
            display: inline-block;
            background: #00a2ff;
            color: white;

            padding: 14px 25px;

            border-radius: 8px;

            text-decoration: none;
            font-weight: bold;

            margin-top: 20px;
        }

        .roblox-button:hover {
            background: #008ed6;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Roblox Verification</h1>

        <p>
            Connect your Roblox account to continue.
        </p>

        <a class="roblox-button" href="#">
            Login with Roblox
        </a>

    </div>

</body>
</html>
