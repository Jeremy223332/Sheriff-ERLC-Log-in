<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roblox Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top, #202020, #0d0d0d);

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
            max-width: 90%;

            background: #181818;

            border: 1px solid #303030;

            border-radius: 18px;

            padding: 40px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            border-radius: 20px;

            background: #00a2ff;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;
        }

        h1 {
            margin: 0 0 12px;

            font-size: 28px;
        }

        p {
            color: #aaa;

            line-height: 1.5;

            margin-bottom: 28px;
        }

        .roblox-button {
            display: block;

            width: 100%;

            padding: 15px;

            background: #00a2ff;

            color: white;

            border-radius: 9px;

            text-decoration: none;

            font-size: 17px;

            font-weight: bold;

            transition: 0.2s;
        }

        .roblox-button:hover {
            background: #008ed6;

            transform: translateY(-1px);
        }

        .notice {
            margin-top: 20px;

            font-size: 12px;

            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">
            🎮
        </div>

        <h1>Roblox Verification</h1>

        <p>
            Connect your Roblox account to verify that you own the account.
        </p>

        <a
            class="roblox-button"
            href="https://YOUR-RENDER-SERVICE.onrender.com/login/roblox"
        >
            Login with Roblox
        </a>

        <div class="notice">
            You will be redirected to Roblox to authorize the connection.
        </div>

    </div>

</body>
</html>
